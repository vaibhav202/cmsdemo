<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400" role="img" aria-labelledby="title desc">
  <title id="title">Supabase Multi-Tenant Data Model</title>
  <desc id="desc">Entity relationship diagram for a vendor-isolated Supabase schema with RLS.</desc>
  <defs>
    <style>
      .bg { fill: #fffafb; }
      .card { fill: #ffffff; stroke: #ead8de; stroke-width: 2; }
      .group { fill: #fbf3f5; stroke: #ead8de; stroke-width: 2; }
      .head { fill: #7b1734; }
      .text { fill: #2c161d; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #765f67; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #2c161d; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .line { stroke: #d5b7c1; stroke-width: 2; fill: none; }
      .tenant { fill: #f7e3e8; stroke: #c46c84; stroke-width: 2; stroke-dasharray: 8 8; }
      .shadow { filter: drop-shadow(0 12px 22px rgba(92, 31, 48, 0.09)); }
    </style>
  </defs>
  <rect class="bg" width="1800" height="1400"/>
  <text x="72" y="94" class="text" font-size="52" font-weight="800">Supabase Multi-Tenant Data Model</text>
  <text x="74" y="136" class="muted" font-size="24">Every business table is isolated by vendor_id, with RLS checking active vendor membership.</text>

  <rect x="76" y="180" width="1648" height="112" rx="22" class="tenant"/>
  <text x="118" y="246" class="text" font-size="30" font-weight="800">vendor_id tenant isolation</text>
  <text x="494" y="246" class="muted" font-size="24">Repeated across tenant-owned tables. URL slugs are convenience only, not security.</text>
  <rect x="1370" y="210" width="300" height="52" rx="26" fill="#7b1734"/>
  <text x="1410" y="244" fill="#ffffff" font-family="Inter, sans-serif" font-size="22" font-weight="800">RLS + vendor_members</text>

  <g class="shadow">
    <rect x="76" y="336" width="500" height="326" rx="22" class="group"/>
    <text x="108" y="382" class="text" font-size="28" font-weight="800">Tenant &amp; Access</text>
    <rect x="108" y="412" width="432" height="68" rx="14" class="card"/>
    <text x="130" y="454" class="mono" font-size="21" font-weight="800">vendors</text>
    <text x="242" y="454" class="muted" font-size="18">id, name, slug, plan, status, logo_asset_id</text>
    <rect x="108" y="500" width="432" height="68" rx="14" class="card"/>
    <text x="130" y="542" class="mono" font-size="21" font-weight="800">profiles</text>
    <text x="244" y="542" class="muted" font-size="18">id, full_name, phone, created_at</text>
    <rect x="108" y="588" width="432" height="50" rx="14" class="card"/>
    <text x="130" y="620" class="mono" font-size="21" font-weight="800">vendor_members</text>
    <text x="320" y="620" class="muted" font-size="18">vendor_id, user_id, role, status</text>
  </g>

  <g class="shadow">
    <rect x="650" y="336" width="500" height="466" rx="22" class="group"/>
    <text x="682" y="382" class="text" font-size="28" font-weight="800">Operations</text>
    <rect x="682" y="412" width="432" height="60" rx="14" class="card"/>
    <text x="704" y="449" class="mono" font-size="20" font-weight="800">menu_categories</text>
    <text x="900" y="449" class="muted" font-size="17">vendor_id, name, sort_order</text>
    <rect x="682" y="492" width="432" height="72" rx="14" class="card"/>
    <text x="704" y="527" class="mono" font-size="20" font-weight="800">menu_items</text>
    <text x="842" y="527" class="muted" font-size="17">vendor_id, category_id, price, cost_price,</text>
    <text x="842" y="550" class="muted" font-size="17">image_asset_id, is_available, is_archived</text>
    <rect x="682" y="584" width="432" height="72" rx="14" class="card"/>
    <text x="704" y="619" class="mono" font-size="20" font-weight="800">orders</text>
    <text x="790" y="619" class="muted" font-size="17">vendor_id, order_no, created_by, status,</text>
    <text x="790" y="642" class="muted" font-size="17">payment_status, subtotal, total</text>
    <rect x="682" y="676" width="432" height="82" rx="14" class="card"/>
    <text x="704" y="711" class="mono" font-size="20" font-weight="800">order_items</text>
    <text x="852" y="711" class="muted" font-size="17">vendor_id, order_id, menu_item_id,</text>
    <text x="852" y="734" class="muted" font-size="17">quantity, price_at_time, cost_at_time</text>
  </g>

  <g class="shadow">
    <rect x="1224" y="336" width="500" height="466" rx="22" class="group"/>
    <text x="1256" y="382" class="text" font-size="28" font-weight="800">Storage &amp; Audit</text>
    <rect x="1256" y="412" width="432" height="94" rx="14" class="card"/>
    <text x="1278" y="447" class="mono" font-size="20" font-weight="800">media_assets</text>
    <text x="1438" y="447" class="muted" font-size="17">vendor_id, bucket, path, kind,</text>
    <text x="1438" y="470" class="muted" font-size="17">mime_type, width, height, size_bytes</text>
    <rect x="1256" y="526" width="432" height="90" rx="14" class="card"/>
    <text x="1278" y="561" class="mono" font-size="20" font-weight="800">audit_logs</text>
    <text x="1416" y="561" class="muted" font-size="17">vendor_id, actor_user_id, action,</text>
    <text x="1416" y="584" class="muted" font-size="17">entity_type, entity_id, created_at</text>
    <rect x="1256" y="646" width="432" height="86" rx="14" fill="#f7e3e8" stroke="#d9a8b6" stroke-width="2"/>
    <text x="1278" y="682" class="text" font-size="21" font-weight="800">Storage object paths</text>
    <text x="1278" y="716" class="mono" font-size="18">vendors/{vendor_id}/...</text>
  </g>

  <g class="shadow">
    <rect x="76" y="858" width="792" height="396" rx="22" class="group"/>
    <text x="108" y="904" class="text" font-size="28" font-weight="800">Inventory</text>
    <rect x="108" y="936" width="724" height="68" rx="14" class="card"/>
    <text x="130" y="977" class="mono" font-size="20" font-weight="800">stock_items</text>
    <text x="278" y="977" class="muted" font-size="18">vendor_id, name, unit, current_quantity, reorder_level, cost_per_unit</text>
    <rect x="108" y="1024" width="724" height="68" rx="14" class="card"/>
    <text x="130" y="1065" class="mono" font-size="20" font-weight="800">stock_movements</text>
    <text x="344" y="1065" class="muted" font-size="18">vendor_id, stock_item_id, change_quantity, reason, created_at</text>
    <rect x="108" y="1112" width="724" height="68" rx="14" class="card"/>
    <text x="130" y="1153" class="mono" font-size="20" font-weight="800">menu_item_ingredients</text>
    <text x="410" y="1153" class="muted" font-size="18">vendor_id, menu_item_id, stock_item_id, quantity_required</text>
  </g>

  <g class="shadow">
    <rect x="932" y="858" width="792" height="396" rx="22" class="group"/>
    <text x="964" y="904" class="text" font-size="28" font-weight="800">Finance &amp; Ledger</text>
    <rect x="964" y="936" width="724" height="68" rx="14" class="card"/>
    <text x="986" y="977" class="mono" font-size="20" font-weight="800">parties</text>
    <text x="1090" y="977" class="muted" font-size="18">vendor_id, name, phone, type</text>
    <rect x="964" y="1024" width="724" height="68" rx="14" class="card"/>
    <text x="986" y="1065" class="mono" font-size="20" font-weight="800">ledger_entries</text>
    <text x="1184" y="1065" class="muted" font-size="18">vendor_id, party_id, direction, amount, note, created_at</text>
    <rect x="964" y="1112" width="724" height="68" rx="14" class="card"/>
    <text x="986" y="1153" class="mono" font-size="20" font-weight="800">expenses</text>
    <text x="1110" y="1153" class="muted" font-size="18">vendor_id, category, amount, date</text>
  </g>

  <path d="M540 612 C620 612, 608 620, 682 620" class="line"/>
  <path d="M1114 528 C1186 528, 1184 458, 1256 458" class="line"/>
  <path d="M1114 718 C1186 718, 1184 458, 1256 458" class="line"/>
  <path d="M832 1146 C894 1146, 902 528, 682 528" class="line"/>
  <path d="M964 1058 C884 1058, 890 620, 1114 620" class="line"/>

  <text x="76" y="1322" class="muted" font-size="22">Design principle: vendor_id is the tenant boundary; vendor_members is the permission layer; RLS is the enforcement layer.</text>
</svg>
