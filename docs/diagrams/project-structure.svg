<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">NextJS Project Structure</title>
  <desc id="desc">Folder tree diagram for the planned NextJS, Supabase, Tailwind, and Shadcn project structure.</desc>
  <defs>
    <style>
      .bg { fill: #fffafb; }
      .panel { fill: #ffffff; stroke: #ead8de; stroke-width: 2; }
      .panel-soft { fill: #fbf3f5; stroke: #ead8de; stroke-width: 2; }
      .accent { fill: #7b1734; }
      .accent-soft { fill: #f6e6eb; }
      .text { fill: #2c161d; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #765f67; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #2c161d; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .line { stroke: #d9bcc5; stroke-width: 2; fill: none; }
      .folder { fill: #9a2445; }
      .file { fill: #765f67; }
      .shadow { filter: drop-shadow(0 14px 24px rgba(92, 31, 48, 0.10)); }
    </style>
  </defs>
  <rect class="bg" width="1600" height="1200"/>
  <rect x="76" y="62" width="1448" height="1076" rx="34" class="panel shadow"/>
  <text x="130" y="132" class="text" font-size="52" font-weight="800">NextJS Project Structure</text>
  <text x="132" y="174" class="muted" font-size="24">Production foundation for a multi-vendor canteen/cafe SaaS app</text>

  <rect x="116" y="224" width="860" height="852" rx="22" class="panel-soft"/>
  <text x="152" y="276" class="mono" font-size="28" font-weight="800">src/</text>

  <g font-size="24">
    <text x="176" y="326" class="mono"><tspan class="folder">app/</tspan></text>
    <path d="M164 300 V915" class="line"/>
    <path d="M164 316 H174" class="line"/>

    <text x="214" y="372" class="mono"><tspan class="folder">(public)/</tspan></text>
    <path d="M202 344 V440" class="line"/>
    <path d="M202 362 H212" class="line"/>
    <text x="252" y="414" class="mono"><tspan class="file">login/</tspan> <tspan class="muted">terms/ privacy/</tspan></text>

    <text x="214" y="470" class="mono"><tspan class="folder">app/[vendorSlug]/</tspan></text>
    <path d="M202 462 H212" class="line"/>
    <text x="252" y="516" class="mono"><tspan class="file">layout.tsx</tspan></text>
    <text x="252" y="558" class="mono"><tspan class="file">order/</tspan> <tspan class="file">kitchen/</tspan> <tspan class="file">queue/</tspan> <tspan class="file">control/</tspan></text>
    <text x="252" y="600" class="mono"><tspan class="file">inventory/</tspan> <tspan class="file">ledger/</tspan> <tspan class="file">reports/</tspan></text>

    <text x="214" y="660" class="mono"><tspan class="folder">api/</tspan></text>
    <path d="M202 650 H212" class="line"/>
    <text x="252" y="704" class="mono"><tspan class="file">uploads/</tspan> <tspan class="file">webhooks/</tspan></text>

    <text x="176" y="780" class="mono"><tspan class="folder">components/</tspan></text>
    <path d="M164 770 H174" class="line"/>
    <text x="214" y="826" class="mono"><tspan class="file">ui/</tspan> <tspan class="file">layout/</tspan> <tspan class="file">orders/</tspan> <tspan class="file">menu/</tspan> <tspan class="file">inventory/</tspan> <tspan class="file">ledger/</tspan></text>

    <text x="176" y="892" class="mono"><tspan class="folder">features/</tspan></text>
    <path d="M164 882 H174" class="line"/>
    <text x="214" y="938" class="mono"><tspan class="file">auth/</tspan> <tspan class="file">vendors/</tspan> <tspan class="file">orders/</tspan> <tspan class="file">menu/</tspan> <tspan class="file">storage/</tspan> <tspan class="file">reports/</tspan></text>

    <text x="176" y="1004" class="mono"><tspan class="folder">lib/</tspan></text>
    <path d="M164 994 H174" class="line"/>
    <text x="214" y="1050" class="mono"><tspan class="file">supabase/browser.ts</tspan> <tspan class="file">server.ts</tspan> <tspan class="file">admin.ts</tspan></text>
    <text x="214" y="1092" class="mono"><tspan class="file">validation/</tspan> <tspan class="file">permissions/</tspan> <tspan class="file">constants/</tspan></text>
  </g>

  <rect x="1030" y="224" width="380" height="168" rx="20" class="panel"/>
  <circle cx="1070" cy="278" r="15" class="accent"/>
  <text x="1102" y="286" class="text" font-size="26" font-weight="800">App Router</text>
  <text x="1070" y="330" class="muted" font-size="22">Handles pages, layouts,</text>
  <text x="1070" y="362" class="muted" font-size="22">route segments, and APIs.</text>

  <rect x="1030" y="428" width="380" height="168" rx="20" class="panel"/>
  <circle cx="1070" cy="482" r="15" class="accent"/>
  <text x="1102" y="490" class="text" font-size="26" font-weight="800">Features</text>
  <text x="1070" y="534" class="muted" font-size="22">Own business logic by</text>
  <text x="1070" y="566" class="muted" font-size="22">domain, not by page.</text>

  <rect x="1030" y="632" width="380" height="168" rx="20" class="panel"/>
  <circle cx="1070" cy="686" r="15" class="accent"/>
  <text x="1102" y="694" class="text" font-size="26" font-weight="800">Infrastructure</text>
  <text x="1070" y="738" class="muted" font-size="22">Supabase clients, validation,</text>
  <text x="1070" y="770" class="muted" font-size="22">permissions, and constants.</text>

  <rect x="1030" y="836" width="380" height="168" rx="20" class="panel"/>
  <circle cx="1070" cy="890" r="15" class="accent"/>
  <text x="1102" y="898" class="text" font-size="26" font-weight="800">Database Folder</text>
  <text x="1070" y="942" class="muted" font-size="22">Keeps migrations, seed data,</text>
  <text x="1070" y="974" class="muted" font-size="22">and RLS policy history.</text>

  <rect x="116" y="1098" width="1294" height="2" fill="#ead8de"/>
  <text x="130" y="1128" class="muted" font-size="19">Recommended for NextJS App Router, TypeScript, TailwindCSS, Shadcn UI, Supabase SSR, and Capacitor-ready deployment.</text>
</svg>
