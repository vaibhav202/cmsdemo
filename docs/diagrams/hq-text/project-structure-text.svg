<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3200" viewBox="0 0 2400 3200" role="img" aria-labelledby="title desc">
  <title id="title">NextJS Project Structure - Text Diagram</title>
  <desc id="desc">Monochrome text-based project structure diagram for the production SaaS application.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 3; }
      .soft { fill: #f7f7f7; stroke: #111111; stroke-width: 3; }
      .line { stroke: #111111; stroke-width: 3; }
      .thin { stroke: #777777; stroke-width: 2; }
      .title { fill: #111111; font-family: Arial, Helvetica, sans-serif; font-size: 72px; font-weight: 800; }
      .subtitle { fill: #333333; font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 400; }
      .h1 { fill: #111111; font-family: Arial, Helvetica, sans-serif; font-size: 42px; font-weight: 800; }
      .h2 { fill: #111111; font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 800; }
      .body { fill: #111111; font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 400; }
      .small { fill: #333333; font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 400; }
      .mono { fill: #111111; font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 30px; font-weight: 400; }
      .mono-bold { fill: #111111; font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 31px; font-weight: 800; }
    </style>
  </defs>

  <rect class="bg" width="2400" height="3200"/>
  <text x="120" y="140" class="title">NEXTJS PROJECT STRUCTURE</text>
  <text x="120" y="196" class="subtitle">Project structure reference for the production canteen/cafe SaaS rebuild</text>
  <line x1="120" y1="240" x2="2280" y2="240" class="line"/>

  <rect x="120" y="300" width="1260" height="2760" class="box"/>
  <text x="170" y="370" class="h1">DIRECTORY TREE</text>
  <line x1="170" y1="405" x2="1330" y2="405" class="thin"/>

  <text x="170" y="480" class="mono-bold">src/</text>
  <text x="210" y="545" class="mono-bold">app/</text>
  <text x="250" y="610" class="mono">(public)/</text>
  <text x="290" y="670" class="mono">login/</text>
  <text x="290" y="730" class="mono">terms/</text>
  <text x="290" y="790" class="mono">privacy/</text>

  <text x="250" y="880" class="mono">app/</text>
  <text x="290" y="940" class="mono">[vendorSlug]/</text>
  <text x="330" y="1000" class="mono">layout.tsx</text>
  <text x="330" y="1060" class="mono">order/</text>
  <text x="330" y="1120" class="mono">kitchen/</text>
  <text x="330" y="1180" class="mono">queue/</text>
  <text x="330" y="1240" class="mono">control/</text>
  <text x="330" y="1300" class="mono">inventory/</text>
  <text x="330" y="1360" class="mono">ledger/</text>
  <text x="330" y="1420" class="mono">reports/</text>

  <text x="250" y="1510" class="mono">api/</text>
  <text x="290" y="1570" class="mono">uploads/</text>
  <text x="290" y="1630" class="mono">webhooks/</text>

  <text x="210" y="1730" class="mono-bold">components/</text>
  <text x="250" y="1790" class="mono">ui/</text>
  <text x="250" y="1850" class="mono">layout/</text>
  <text x="250" y="1910" class="mono">orders/</text>
  <text x="250" y="1970" class="mono">menu/</text>
  <text x="250" y="2030" class="mono">inventory/</text>
  <text x="250" y="2090" class="mono">ledger/</text>

  <text x="210" y="2190" class="mono-bold">features/</text>
  <text x="250" y="2250" class="mono">auth/</text>
  <text x="250" y="2310" class="mono">vendors/</text>
  <text x="250" y="2370" class="mono">orders/</text>
  <text x="250" y="2430" class="mono">menu/</text>
  <text x="250" y="2490" class="mono">storage/</text>
  <text x="250" y="2550" class="mono">reports/</text>

  <text x="210" y="2650" class="mono-bold">lib/</text>
  <text x="250" y="2710" class="mono">supabase/browser.ts</text>
  <text x="250" y="2770" class="mono">supabase/server.ts</text>
  <text x="250" y="2830" class="mono">supabase/admin.ts</text>
  <text x="250" y="2890" class="mono">validation/</text>
  <text x="250" y="2950" class="mono">permissions/</text>
  <text x="250" y="3010" class="mono">constants/</text>

  <rect x="1460" y="300" width="820" height="520" class="soft"/>
  <text x="1510" y="370" class="h1">STRUCTURE RULES</text>
  <line x1="1510" y1="405" x2="2230" y2="405" class="thin"/>
  <text x="1510" y="470" class="body">- Routes live in app/.</text>
  <text x="1510" y="525" class="body">- Reusable UI lives in components/.</text>
  <text x="1510" y="580" class="body">- Business logic lives in features/.</text>
  <text x="1510" y="635" class="body">- Supabase clients live in lib/.</text>
  <text x="1510" y="690" class="body">- Database history lives in db/.</text>
  <text x="1510" y="745" class="body">- Vendor isolation is not a UI concern.</text>

  <rect x="1460" y="900" width="820" height="520" class="box"/>
  <text x="1510" y="970" class="h1">SERVER-SIDE RESPONSIBILITY</text>
  <line x1="1510" y1="1005" x2="2230" y2="1005" class="thin"/>
  <text x="1510" y="1070" class="body">- Session verification</text>
  <text x="1510" y="1125" class="body">- Vendor membership lookup</text>
  <text x="1510" y="1180" class="body">- Role permission checks</text>
  <text x="1510" y="1235" class="body">- Zod validation</text>
  <text x="1510" y="1290" class="body">- Image normalization using Sharp</text>
  <text x="1510" y="1345" class="body">- Supabase Storage writes</text>

  <rect x="1460" y="1500" width="820" height="520" class="soft"/>
  <text x="1510" y="1570" class="h1">CLIENT-SIDE RESPONSIBILITY</text>
  <line x1="1510" y1="1605" x2="2230" y2="1605" class="thin"/>
  <text x="1510" y="1670" class="body">- Mobile-first dashboard UX</text>
  <text x="1510" y="1725" class="body">- Fast form feedback</text>
  <text x="1510" y="1780" class="body">- Image previews</text>
  <text x="1510" y="1835" class="body">- Realtime order updates</text>
  <text x="1510" y="1890" class="body">- PWA-friendly navigation</text>
  <text x="1510" y="1945" class="body">- Capacitor-safe interaction patterns</text>

  <rect x="1460" y="2100" width="820" height="700" class="box"/>
  <text x="1510" y="2170" class="h1">MIGRATION APPROACH</text>
  <line x1="1510" y1="2205" x2="2230" y2="2205" class="thin"/>
  <text x="1510" y="2270" class="body">1. Treat current Vite app as UX prototype.</text>
  <text x="1510" y="2325" class="body">2. Start a fresh NextJS foundation.</text>
  <text x="1510" y="2380" class="body">3. Add Supabase auth and tenant model.</text>
  <text x="1510" y="2435" class="body">4. Add RLS policies before features.</text>
  <text x="1510" y="2490" class="body">5. Move dashboards behind protected routes.</text>
  <text x="1510" y="2545" class="body">6. Replace mocks with Supabase tables.</text>
  <text x="1510" y="2600" class="body">7. Add image upload normalization.</text>
  <text x="1510" y="2655" class="body">8. Add realtime queue.</text>
  <text x="1510" y="2710" class="body">9. Add inventory, ledger, reports.</text>

  <line x1="120" y1="3100" x2="2280" y2="3100" class="line"/>
  <text x="120" y="3160" class="h2">Primary goal:</text>
  <text x="350" y="3160" class="body">separate demo UI from production security, data access, validation, and tenant boundaries.</text>
</svg>
