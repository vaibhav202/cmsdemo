<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" role="img" aria-labelledby="title desc">
  <title id="title">Core Security and Upload Flows</title>
  <desc id="desc">Flowchart showing login, protected dashboard operations, and image upload normalization.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#9a2445"/>
    </marker>
    <style>
      .bg { fill: #fffafb; }
      .lane { fill: #fbf3f5; stroke: #ead8de; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #ead8de; stroke-width: 2; }
      .decision { fill: #ffffff; stroke: #9a2445; stroke-width: 3; }
      .accent { fill: #7b1734; }
      .accent-soft { fill: #f7e3e8; stroke: #d9a8b6; stroke-width: 2; }
      .text { fill: #2c161d; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #765f67; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #2c161d; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .flow { stroke: #9a2445; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line { stroke: #d5b7c1; stroke-width: 2; fill: none; }
      .shadow { filter: drop-shadow(0 12px 22px rgba(92, 31, 48, 0.09)); }
    </style>
  </defs>
  <rect class="bg" width="1800" height="1300"/>
  <text x="70" y="90" class="text" font-size="52" font-weight="800">Core Security &amp; Upload Flows</text>
  <text x="72" y="132" class="muted" font-size="24">NextJS validates intent; Supabase RLS enforces tenant isolation; Storage keeps normalized assets.</text>

  <g class="shadow">
    <rect x="70" y="180" width="1660" height="290" rx="26" class="lane"/>
    <text x="110" y="230" class="text" font-size="30" font-weight="800">1. Login &amp; Vendor Access</text>
    <rect x="110" y="270" width="180" height="70" rx="16" class="box"/>
    <text x="146" y="313" class="text" font-size="21" font-weight="700">Open App</text>
    <path d="M290 305 H360" class="flow"/>
    <rect x="360" y="270" width="230" height="70" rx="16" class="box"/>
    <text x="392" y="313" class="text" font-size="21" font-weight="700">Supabase Login</text>
    <path d="M590 305 H660" class="flow"/>
    <rect x="660" y="270" width="230" height="70" rx="16" class="box"/>
    <text x="686" y="313" class="text" font-size="21" font-weight="700">Server Reads Session</text>
    <path d="M890 305 H960" class="flow"/>
    <rect x="960" y="270" width="230" height="70" rx="16" class="box"/>
    <text x="990" y="313" class="text" font-size="21" font-weight="700">Load Memberships</text>
    <path d="M1190 305 H1260" class="flow"/>
    <path d="M1350 255 L1445 305 L1350 355 L1255 305 Z" class="decision"/>
    <text x="1297" y="313" class="text" font-size="20" font-weight="800">Active member?</text>
    <path d="M1445 305 H1512" class="flow"/>
    <rect x="1512" y="270" width="170" height="70" rx="16" class="accent"/>
    <text x="1546" y="313" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="800">Dashboard</text>
    <path d="M1350 355 V420 H1512" class="flow"/>
    <rect x="1512" y="385" width="170" height="70" rx="16" fill="#ffffff" stroke="#d9a8b6" stroke-width="2"/>
    <text x="1543" y="428" class="text" font-size="20" font-weight="800">Access Denied</text>
    <text x="1464" y="291" class="muted" font-size="18">yes</text>
    <text x="1370" y="395" class="muted" font-size="18">no</text>
  </g>

  <g class="shadow">
    <rect x="70" y="520" width="1660" height="300" rx="26" class="lane"/>
    <text x="110" y="570" class="text" font-size="30" font-weight="800">2. Protected Dashboard Operation</text>
    <rect x="110" y="614" width="190" height="74" rx="16" class="box"/>
    <text x="138" y="658" class="text" font-size="21" font-weight="700">Staff Action</text>
    <path d="M300 651 H370" class="flow"/>
    <rect x="370" y="614" width="240" height="74" rx="16" class="box"/>
    <text x="402" y="645" class="text" font-size="20" font-weight="700">NextJS Validation</text>
    <text x="432" y="672" class="muted" font-size="18">Zod schemas</text>
    <path d="M610 651 H680" class="flow"/>
    <rect x="680" y="614" width="240" height="74" rx="16" class="box"/>
    <text x="710" y="645" class="text" font-size="20" font-weight="700">Role Permission</text>
    <text x="732" y="672" class="muted" font-size="18">owner/admin/staff</text>
    <path d="M920 651 H990" class="flow"/>
    <rect x="990" y="614" width="230" height="74" rx="16" class="box"/>
    <text x="1018" y="645" class="text" font-size="20" font-weight="700">Supabase Mutation</text>
    <text x="1048" y="672" class="muted" font-size="18">Postgres query</text>
    <path d="M1220 651 H1290" class="flow"/>
    <rect x="1290" y="614" width="190" height="74" rx="16" class="accent-soft"/>
    <text x="1324" y="645" class="text" font-size="20" font-weight="800">RLS Policy</text>
    <text x="1308" y="672" class="muted" font-size="18">vendor_id check</text>
    <path d="M1480 651 H1540" class="flow"/>
    <rect x="1540" y="614" width="150" height="74" rx="16" class="accent"/>
    <text x="1574" y="645" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="800">UI +</text>
    <text x="1560" y="672" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="800">Realtime</text>
    <rect x="1290" y="716" width="400" height="52" rx="26" fill="#ffffff" stroke="#ead8de" stroke-width="2"/>
    <text x="1320" y="749" class="muted" font-size="20">Queue subscriptions update live views.</text>
  </g>

  <g class="shadow">
    <rect x="70" y="870" width="1660" height="344" rx="26" class="lane"/>
    <text x="110" y="920" class="text" font-size="30" font-weight="800">3. Image Upload Normalization</text>
    <rect x="110" y="964" width="182" height="74" rx="16" class="box"/>
    <text x="137" y="995" class="text" font-size="20" font-weight="700">Select Image</text>
    <text x="144" y="1022" class="muted" font-size="18">phone/gallery</text>
    <path d="M292 1001 H352" class="flow"/>
    <rect x="352" y="964" width="182" height="74" rx="16" class="box"/>
    <text x="395" y="1008" class="text" font-size="20" font-weight="700">Preview</text>
    <path d="M534 1001 H594" class="flow"/>
    <rect x="594" y="964" width="226" height="74" rx="16" class="box"/>
    <text x="622" y="995" class="text" font-size="20" font-weight="700">API Route Receives</text>
    <text x="666" y="1022" class="muted" font-size="18">auth + file</text>
    <path d="M820 1001 H880" class="flow"/>
    <rect x="880" y="964" width="222" height="74" rx="16" class="box"/>
    <text x="918" y="995" class="text" font-size="20" font-weight="700">Validate Inputs</text>
    <text x="904" y="1022" class="muted" font-size="18">role, MIME, size</text>
    <path d="M1102 1001 H1162" class="flow"/>
    <rect x="1162" y="964" width="218" height="74" rx="16" class="accent-soft"/>
    <text x="1216" y="995" class="text" font-size="20" font-weight="800">Sharp</text>
    <text x="1188" y="1022" class="muted" font-size="18">resize to WebP</text>
    <path d="M1380 1001 H1440" class="flow"/>
    <rect x="1440" y="964" width="230" height="74" rx="16" class="box"/>
    <text x="1470" y="995" class="text" font-size="20" font-weight="700">Storage Upload</text>
    <text x="1460" y="1022" class="mono" font-size="16">vendors/{vendor_id}/...</text>

    <path d="M1555 1038 V1098 H410" class="flow"/>
    <rect x="410" y="1098" width="274" height="72" rx="16" class="box"/>
    <text x="446" y="1129" class="text" font-size="20" font-weight="700">Insert media_assets</text>
    <text x="462" y="1156" class="muted" font-size="18">metadata row</text>
    <path d="M684 1134 H754" class="flow"/>
    <rect x="754" y="1098" width="274" height="72" rx="16" class="box"/>
    <text x="782" y="1129" class="text" font-size="20" font-weight="700">Link to Entity</text>
    <text x="784" y="1156" class="muted" font-size="18">vendor/menu/member</text>
    <path d="M1028 1134 H1098" class="flow"/>
    <rect x="1098" y="1098" width="274" height="72" rx="16" class="accent"/>
    <text x="1135" y="1129" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="800">Optimized Image</text>
    <text x="1166" y="1156" fill="#ffffff" font-family="Inter, sans-serif" font-size="18">visible in UI</text>

    <rect x="110" y="1106" width="238" height="54" rx="27" fill="#ffffff" stroke="#ead8de" stroke-width="2"/>
    <text x="136" y="1140" class="muted" font-size="19">No manual resizing by vendors.</text>
  </g>
</svg>
