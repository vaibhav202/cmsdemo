name: I18n security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate translation security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20.x
      - name: Install locked dependencies
        run: npm ci
      - name: Validate catalogs and rendering boundaries
        run: npm run i18n:check
